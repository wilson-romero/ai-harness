<!doctype html>
<!--
  Synthetic chat page for automated tests. It imitates nothing real: invented ids, invented
  labels, invented canary strings. Behaviour is chosen with query parameters:
    early=done_control  the done control appears halfway through the reply
    pause_ms=N          the reply stops changing for N ms halfway through
    never_finish=1      the reply stops halfway and never ends
    forget=1            an existing conversation cannot be reopened
    chunk_ms=N          delay between reply chunks (default 40)
    id_delay_ms=N       the conversation id reaches the address N ms after the reply ends,
                        as measured on the real page (default: as soon as the server answers)
    id_never=1          the id never reaches the address
    start_ms=N          the reply starts N ms after the server answers
    ready_ms=N          the composer appears N ms after the page loads
    chips=1             once the reply ends, a toolbar of follow-up suggestion buttons
                        appears inside the turn, after the reply (as on the real page)
    restore=1           the new-chat address goes to the last conversation (server redirect)
    keepurl=1           a conversation that no longer exists shows an empty chat but keeps
                        its id in the address; the next send opens another conversation
    slowhist=1          an existing conversation's turns arrive 3.5 s after the page loads,
                        inserted above anything already shown
    deaf=1              the send button does nothing: the prompt stays in the editor
    maxlength=N         the editor takes at most N characters
    window=N            a reopened conversation shows only its last N questions and answers,
                        as a virtualized list does
    bounce=1            the server receives the prompt, the page shows an error notice as a
                        turn and keeps the prompt in the editor (no user turn, never emptied)
  A response-mode selector, only with modes=... (change response-mode). Invented labels: the
  options are "Synthetic automatic", "Synthetic brisk" and "Synthetic pondering" (auto, quick,
  deep). The page posts the mode it is in with each prompt and every mode it switches to.
    modes=menu          a button (#synthetic-mode-trigger, constant label) opens a role=menu of
                        role=menuitemradio options marked with aria-checked
    modes=listbox       a role=combobox button (data-testid synthetic-mode-picker) whose label
                        is the current mode opens a role=listbox of role=option, aria-selected
    mode_start=M        the mode the page starts in (default auto)
    mode_persist=1      the chosen mode survives a reload (kept in the profile's storage)
    mode_stuck=1        choosing an option closes the list and changes nothing
    mode_late_ms=N      a chosen mode applies N ms after the click
    mode_fallback=M     the page switches to mode M when a reply ends
    mode_newchat=1      choosing an option also opens a new, empty chat
    mode_sticky=1       choosing an option applies it, but the list stays open and Escape does
                        not close it
    mode_disabled=M     the option of mode M is aria-disabled: a click does nothing
    mode_twice=1        every option is in the list twice
    mode_reread_fail=1  once a reply ends, a second copy of the opener appears
    mode_history=1      choosing an option inserts an older question and answer above the
                        thread, as a history that arrives late
    mode_append=1       choosing an option adds a user turn at the end of the thread
    mode_navigate=1     choosing an option moves the address to another conversation
    mode_label=TEXT     the opener also carries the aria-label TEXT
  With modes=..., each prompt also tells the server whether the list was open when it was sent.
  A reply the server sends with `html` (a prompt with ZQX-RICH-<name>) streams as text, then
  is replaced by that HTML, as a page renders the Markdown it received.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Synthetic chat ZZ-CANARY-PAGE-TITLE-6120</title>
<style>
  body { font-family: sans-serif; display: flex; gap: 1rem; }
  nav { width: 12rem; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .turn { border: 1px solid #ccc; margin: .25rem 0; padding: .25rem; white-space: pre-wrap; }
  #synthetic-composer { width: 30rem; height: 4rem; }
</style>
</head>
<body>
<nav id="synthetic-history">
  <div id="synthetic-account">ZZ-CANARY-ACCOUNT-3391</div>
  <a href="#" class="title">ZZ-CANARY-TITLE-7781 quarterly plan</a>
  <a href="#" class="title">ZZ-CANARY-TITLE-7782 vendor review</a>
</nav>
<main>
  <button id="synthetic-new-chat" type="button">New synthetic chat</button>
  <section id="synthetic-thread"></section>
  <textarea id="synthetic-composer" aria-label="Synthetic message box"></textarea>
  <button id="synthetic-send" type="button">Send synthetic message</button>
  <button id="synthetic-stop" type="button" hidden>Stop synthetic reply</button>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const chunkMs = Number(params.get("chunk_ms") || 40);
  const pauseMs = Number(params.get("pause_ms") || 0);
  const early = params.get("early") || "";
  const neverFinish = params.get("never_finish") === "1";
  const forget = params.get("forget") === "1";
  const idDelay = params.has("id_delay_ms") ? Number(params.get("id_delay_ms")) : null;
  const idNever = params.get("id_never") === "1";
  const startMs = Number(params.get("start_ms") || 0);
  const readyMs = Number(params.get("ready_ms") || 0);
  const chips = params.get("chips") === "1";
  const keepUrl = params.get("keepurl") === "1";
  const slowHist = params.get("slowhist") === "1";
  const deaf = params.get("deaf") === "1";
  const bounce = params.get("bounce") === "1";
  const shownPairs = Number(params.get("window") || 0);
  const modesShape = params.get("modes") || "";
  const MODE_LABELS = { auto: "Synthetic automatic", quick: "Synthetic brisk", deep: "Synthetic pondering" };
  const modeStuck = params.get("mode_stuck") === "1";
  const modeLateMs = Number(params.get("mode_late_ms") || 0);
  const modeFallback = params.get("mode_fallback") || "";
  const modeNewChat = params.get("mode_newchat") === "1";
  const modePersist = params.get("mode_persist") === "1";
  const modeSticky = params.get("mode_sticky") === "1";
  const modeDisabled = params.get("mode_disabled") || "";
  const modeTwice = params.get("mode_twice") === "1";
  const modeRereadFail = params.get("mode_reread_fail") === "1";
  const modeHistory = params.get("mode_history") === "1";
  const modeAppend = params.get("mode_append") === "1";
  const modeNavigate = params.get("mode_navigate") === "1";
  const modeLabel = params.get("mode_label") || "";
  let mode = params.get("mode_start") || "auto";
  if (modePersist) {
    try { mode = localStorage.getItem("synthetic-mode") || mode; } catch (e) { /* none */ }
  }
  let modeTrigger = null, modeList = null;
  const thread = document.getElementById("synthetic-thread");
  const composer = document.getElementById("synthetic-composer");
  const send = document.getElementById("synthetic-send");
  const stop = document.getElementById("synthetic-stop");
  let conversation = null;
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  if (params.has("maxlength")) composer.maxLength = Number(params.get("maxlength"));

  function addTurn(role, text) {
    const turn = document.createElement("div");
    turn.className = "turn " + role;
    turn.textContent = text;
    thread.appendChild(turn);
    return turn;
  }
  function renderRich(turn, html) {
    const rich = document.createElement("div");
    rich.className = "synthetic-rich";
    rich.style.whiteSpace = "normal";
    rich.innerHTML = html;  // a test fixture from the local server, never page input
    turn.appendChild(rich);
  }
  function addDone(turn) {
    if (turn.querySelector(".synthetic-copy")) return;
    const copy = document.createElement("button");
    copy.type = "button";
    copy.className = "synthetic-copy";
    copy.textContent = "Copy";
    turn.appendChild(copy);
  }
  function showConversation(id) {
    conversation = id;
    history.replaceState(null, "", "/c/" + id + location.search);
  }
  function newChat() {
    conversation = null;
    thread.replaceChildren();
    history.replaceState(null, "", "/app" + location.search);
  }
  async function load() {
    const match = location.pathname.match(/^\/c\/([^/]+)$/);
    if (!match) return;
    const response = forget ? null : await fetch("/api/conversation/" + match[1]);
    if (!response || !response.ok) {
      if (keepUrl) { conversation = null; thread.replaceChildren(); return; }  // the id stays
      newChat();
      return;
    }
    const data = await response.json();
    conversation = match[1];
    if (slowHist) await sleep(3500);
    const first = thread.firstChild;
    for (const turn of shownPairs ? data.turns.slice(-2 * shownPairs) : data.turns) {
      const element = addTurn(turn.role, turn.html ? "" : turn.text);
      if (turn.html) renderRich(element, turn.html);
      if (turn.role === "assistant") addDone(element);
      if (first) thread.insertBefore(element, first);  // history goes above what is shown
    }
  }
  function renderMode() {
    if (!modeTrigger) return;
    if (modesShape === "listbox") modeTrigger.textContent = MODE_LABELS[mode];
    const mark = modesShape === "menu" ? "aria-checked" : "aria-selected";
    for (const option of modeList.children) {
      if (option.dataset.mode === modeDisabled) option.setAttribute("aria-disabled", "true");
      option.setAttribute(mark, option.dataset.mode === mode ? "true" : "false");
    }
  }
  function setMode(next) {
    mode = next;
    if (modePersist) {
      try { localStorage.setItem("synthetic-mode", next); } catch (e) { /* none */ }
    }
    renderMode();
    fetch("/api/mode", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: next }),
    });
  }
  function showModes(open) {
    modeList.hidden = !open;
    modeTrigger.setAttribute("aria-expanded", open ? "true" : "false");
  }
  function chooseMode(next) {
    if (next === modeDisabled) return;  // a disabled option: nothing happens, the list stays
    if (!modeSticky) showModes(false);
    if (modeStuck) return;
    const apply = () => {
      setMode(next);
      if (modeNewChat) newChat();
      if (modeHistory) {
        const first = thread.firstChild;
        for (const role of ["user", "assistant"]) {
          const old = document.createElement("div");
          old.className = "turn " + role;
          old.textContent = "ZZ-LATE-HISTORY " + role;
          thread.insertBefore(old, first);
        }
      }
      if (modeAppend) addTurn("user", "ZZ-MODE-TURN");
      if (modeNavigate) history.replaceState(null, "", "/c/synthetic-other" + location.search);
    };
    if (modeLateMs) setTimeout(apply, modeLateMs); else apply();
  }
  function buildModes() {
    const menu = modesShape === "menu";
    modeTrigger = document.createElement("button");
    modeTrigger.type = "button";
    modeTrigger.setAttribute("aria-expanded", "false");
    if (menu) {
      modeTrigger.id = "synthetic-mode-trigger";
      modeTrigger.setAttribute("aria-haspopup", "menu");
      modeTrigger.textContent = "Synthetic mode";
    } else {
      modeTrigger.setAttribute("role", "combobox");
      modeTrigger.setAttribute("aria-haspopup", "listbox");
      modeTrigger.dataset.testid = "synthetic-mode-picker";
    }
    modeList = document.createElement(menu ? "div" : "ul");
    modeList.setAttribute("role", menu ? "menu" : "listbox");
    modeList.hidden = true;
    for (const key of modeTwice ? ["auto", "quick", "deep", "auto", "quick", "deep"]
                                : ["auto", "quick", "deep"]) {
      const option = document.createElement(menu ? "div" : "li");
      option.setAttribute("role", menu ? "menuitemradio" : "option");
      option.tabIndex = -1;
      option.dataset.mode = key;
      option.textContent = MODE_LABELS[key];
      option.addEventListener("click", () => chooseMode(key));
      modeList.appendChild(option);
    }
    if (modeLabel) modeTrigger.setAttribute("aria-label", modeLabel);
    modeTrigger.addEventListener("click", () => showModes(modeList.hidden));
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !modeSticky) showModes(false);
    });
    composer.before(modeTrigger);
    document.body.appendChild(modeList);  // as a portal: outside the chat, at the end
    renderMode();
  }
  async function submit() {
    const prompt = composer.value;
    if (!prompt) return;
    const sentMode = modesShape ? mode : null;
    const listOpen = modesShape ? !modeList.hidden : null;
    if (bounce) {
      await fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation, prompt, mode: sentMode, list_open: listOpen }),
      });
      addTurn("assistant notice", "ZZ-ERROR-NOTICE");
      return;
    }
    composer.value = "";
    send.disabled = true;
    addTurn("user", prompt);
    send.hidden = true;
    stop.hidden = false;
    const response = await fetch("/api/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation, prompt, mode: sentMode, list_open: listOpen }),
    });
    const data = await response.json();
    conversation = data.conversation;
    if (idDelay === null && !idNever) showConversation(data.conversation);
    if (startMs) await sleep(startMs);
    const turn = addTurn("assistant", "");
    // A screen-reader label, visually hidden, before the reply (as real chat pages have).
    const label = document.createElement("h6");
    label.className = "sr-only";
    label.textContent = "ZZ-SR-LABEL said:";
    const body = document.createTextNode("");
    turn.append(label, body);
    turn.setAttribute("aria-busy", "true");
    const reply = data.reply;
    const half = Math.floor(reply.length / 2);
    const step = Math.max(5, Math.ceil(reply.length / 60));
    for (let i = 0; i < reply.length; i += step) {
      if (i >= half && i - step < half) {
        if (early === "done_control") addDone(turn);
        if (neverFinish) return;
        if (pauseMs) await sleep(pauseMs);
      }
      body.textContent = reply.slice(0, i + step);
      await sleep(chunkMs);
    }
    if (data.html) { body.textContent = ""; renderRich(turn, data.html); }
    turn.setAttribute("aria-busy", "false");
    addDone(turn);
    if (chips) {
      const bar = document.createElement("div");
      bar.setAttribute("role", "toolbar");
      for (const n of [1, 2, 3]) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "synthetic-suggestion";
        chip.textContent = "ZZ-CHIP-" + n + " follow-up suggestion";
        bar.appendChild(chip);
      }
      turn.appendChild(bar);
    }
    if (modeFallback && modeTrigger) setMode(modeFallback);
    if (modeRereadFail && modeTrigger) modeTrigger.after(modeTrigger.cloneNode(true));
    stop.hidden = true;
    send.hidden = false;
    if (idDelay !== null && !idNever) {
      const id = data.conversation;
      setTimeout(() => showConversation(id), idDelay);
    }
  }

  // Like many chat pages, sending is possible only once something is typed.
  send.disabled = true;
  composer.addEventListener("input", () => { send.disabled = !composer.value; });
  send.addEventListener("click", () => { if (!deaf) submit(); });
  document.getElementById("synthetic-new-chat").addEventListener("click", newChat);
  if (modesShape === "menu" || modesShape === "listbox") buildModes();
  if (readyMs) {
    composer.hidden = true;
    setTimeout(() => { composer.hidden = false; }, readyMs);
  }
  load();
})();
</script>
</body>
</html>
